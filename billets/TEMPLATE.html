<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  GABARIT D'UN BILLET — 3 ÉTAPES :

  1. Copie ce fichier dans /billets/, renomme-le avec le slug de ton article
     (ex: mon-nouveau-billet.html)
  2. Remplace le titre (<h2>), la date affichée, et le texte de l'article
     à l'intérieur de <div class="billet-corps">
  3. Ajoute une entrée dans billets/billets.json avec le même slug, le titre
     et la date — le billet apparaîtra automatiquement sur index.html et
     billets.html, sans toucher à aucune autre page.

  Le reste (header, bandeau "en ce moment", pied de page, sidebar) est
  injecté automatiquement par commun.js, rien à modifier ici.
-->
<title>bureau des projets - blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bebas+Neue&family=Public+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="shortcut icon" type="image/png" href="../favicon.png"/>
</head>
<body>
<div class="wrap">

  <main>

    <h2>Titre du billet</h2>
    <p class="tagline-date">le [jour] [mois] [année]</p>
    <div class="billet-corps">
      <p>Écris ton article ici, un paragraphe par balise &lt;p&gt;.</p>
      <p>Pour une image : &lt;img class="blog" src="../assets/blog/nom-du-fichier.png"&gt;</p>
    </div>
    <p class="tagline-signature">par Jordan Mrt</p>

  </main>

  <aside></aside>

</div>

<script src="../commun.js"></script>

</body>
</html>
